<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Excel Template Conversion Tool</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
    <div class="container">

        <h2>Excel Template Conversion Tool</h2>

        <input type="file" id="fileInput" accept=".xlsx, .xls" />

        <!-- <div class="loading" id="loadingText">Processing... Please wait</div> -->

        <div class="box">
            <h3>Download Output Templates</h3>

            <button id="btnAddition" disabled>Download Addition Template</button>
            <button id="btnModification" disabled>Download Modification Template</button>
            <button id="btnDeletion" disabled>Download Deletion Template</button>
        </div>

    </div>

    <!-- External Script -->
    <script src="script.js"></script>
</body>

</html>
