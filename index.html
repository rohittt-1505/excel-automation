<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Excel Template Conversion Tool</title>
  <link rel="stylesheet" href="style.css" />
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Excel Template Conversion Tool</h1>
    </header>

    <main>
      <div class="card">
        <label class="file-label">
          <input id="file-input" type="file" accept=".xlsx, .xls" />
          <span>Select Original Template (Excel)</span>
        </label>

        <div class="buttons">
          <button id="process-btn" class="btn primary" disabled>Process & Generate</button>
        </div>

        <div id="download-area" class="download-area hidden">
          <h3>Downloads</h3>
          <div class="download-buttons">
            <a id="dl-add" class="btn" download="Template_for_Addition.xlsx">Download Template_for_Addition.xlsx</a>
            <a id="dl-mod" class="btn" download="Modification_Template.xlsx">Download Modification_Template.xlsx</a>
            <a id="dl-del" class="btn" download="Template_for_Deletion.xlsx">Download Template_for_Deletion.xlsx</a>
          </div>
          <div id="log" class="log"></div>
        </div>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
